<nav class="site-navigation" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 820px; margin: 0 auto; padding: 15px 20px; box-sizing: border-box; font-family: sans-serif;">
  
  <!-- 🛠️ DYNAMIC HISTORICAL BACK BUTTON (ONLY HIDES ON THE MAIN HOMEPAGE) -->
  <div class="back-navigation">
    {% if page.url != "/" and page.url != "/index.html" %}
      <a href="javascript:history.back()" style="color: #000; text-decoration: none; font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 5px;" title="Go back">
        <span>←</span> Back
      </a>
    {% else %}
      <span>&nbsp;</span>
    {% endif %}
  </div>

  <!-- RIGHT SIDE: CLEAN PORTFOLIO LINKS -->
  <div class="menu-links" style="display: flex; gap: 20px;">
    {% for item in site.data.menu %}
      <a href="{{ item.url | relative_url }}" style="color: #000; text-decoration: none; font-weight: bold; font-size: 0.95rem; {% if page.url == item.url %}border-bottom: 2px solid #000;{% endif %}">
        {{ item.title }}
      </a>
    {% endfor %}
  </div>

</nav>
