<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  
  <style>
    /* 🎨 CLEAN CANVAS BACKGROUND SYSTEM */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: #ffffff !important;
      color: #111111 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    .project-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px 80px 20px;
      box-sizing: border-box;
    }

    /* PREMIUM TOP NAVIGATION HEADER TABS */
    .menu-tab {
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 4px;
      font-family: sans-serif;
      display: inline-block;
      background-color: transparent;
      color: #000000;
      border: 1px solid rgba(0,0,0,0.15);
    }
    .menu-tab.active {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #000000;
    }

    /* 📐 HIGH-CONTRAST BLACK FRAME SLIDER */
    .slider-frame {
      width: 100%;
      max-width: 760px;
      margin: 30px auto 40px auto;
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      border: 3px solid #000000; /* Solid Deep Black Border Line */
      background: #000000; /* Pure Black Core Window background */
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .slides-viewport {
      width: 100%;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .portfolio-slide {
      display: none;
      width: 100%;
    }
    .portfolio-slide.active-slide {
      display: block;
    }
    .slide-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      background: #000000;
    }

    /* MATTE BLACK CONTROL INTERFACE BAR */
    .slideshow-controls-bar {
      display: flex;
      align-items: center;
      background: #111111; /* Off-Black control panel base */
      padding: 12px 18px;
      border-top: 1px solid #222222;
    }
    .nav-arrow-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
      margin-right: 14px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s, color 0.2s;
    }
    .nav-arrow-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #f1c40f; /* Quick flash matching your yellow base highlights */
    }
    .slide-dots-indicator {
      display: flex;
      gap: 6px;
      margin-left: 10px;
    }
    .step-dot {
      width: 8px;
      height: 8px;
      background: #444444;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }
    .step-dot.active-dot {
      background: #58a6ff; /* High contrast active indicator link */
      box-shadow: 0 0 6px rgba(88, 166, 255, 0.7);
    }
    .slide-counter-display {
      margin-left: auto;
      color: #aaaaaa;
      font-family: monospace;
      font-size: 14px;
    }

    .social-icon-link { display: inline-block; transition: transform 0.2s ease; }
    .social-icon-link:hover { transform: scale(1.2) translateY(-2px); }
  </style>
</head>
<body>

  <div class="project-container">

    <!-- 🧭 TOP MENU LINKS NAVIGATION -->
    <nav style="display: flex; justify-content: flex-end; gap: 10px; width: 100%; margin-bottom: 20px;">
      <a href="{{ '/' | relative_url }}" class="menu-tab">Home</a>
      <a href="{{ '/about.html' | relative_url }}" class="menu-tab">About</a>
      <a href="{{ '/projects.html' | relative_url }}" class="menu-tab active">Projects</a>
    </nav>

    <h1 style="font-size: 2.5rem; font-weight: 800; margin: 20px 0 5px 0; font-family: serif; line-height: 1.2;">{{ page.title }}</h1>
    <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 30px;">
    
    <!-- 🎬 DYNAMIC FULL SLIDESHOW COMPONENT WITH MULTI-IMAGE AUTO CAPABILITIES -->
    {% if page.slides %}
    <div class="slider-frame">
      
      <!-- Safe Image Render Region -->
      <div class="slides-viewport">
        {% for slide_img in page.slides %}
        <div class="portfolio-slide {% if forloop.first %}active-slide{% endif %}">
          <img src="{{ slide_img | relative_url }}" alt="Project Slide {{ forloop.index }}" class="slide-img">
        </div>
        {% endfor %}
      </div>

      <!-- Black Operational Dashboard Deck -->
      <div class="slideshow-controls-bar">
        <button class="nav-arrow-btn" onclick="changeSlide(-1)" title="Previous Slide">&#10094;</button>
        <button class="nav-arrow-btn play-pause-btn" onclick="togglePlay()" title="Play/Pause">&#9658;</button>
        <button class="nav-arrow-btn" onclick="changeSlide(1)" title="Next Slide">&#10095;</button>
        
        <!-- Interactive Slide Tracking Dots -->
        <div class="slide-dots-indicator">
          {% for slide_img in page.slides %}
          <span class="step-dot {% if forloop.first %}active-dot{% endif %}" onclick="goToSlide({{ forloop.index0 }})"></span>
          {% endfor %}
        </div>

        <!-- Real-Time Interactive Fractional Slide Tracker Count -->
        <div class="slide-counter-display">
          <span id="current-slide-num">1</span> / <span id="total-slides-num">{{ page.slides.size }}</span>
        </div>
      </div>

    </div>
    {% endif %}

    <!-- 🎯 {{ content }} WAS REMOVED FROM HERE TO COMPLETELY STRIP THE BODY TEXT -->

    <!-- 🔗 SOCIAL CONNECT BADGES FOR CASE STUDY BASE DOCK -->
    <div style="margin-top: 60px; padding-top: 30px; border-top: 1px solid #eee; text-align: center; display: flex; justify-content: center; gap: 30px;">
      <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="LinkedIn">
        <svg style="width:24px; height:22px; fill:#000;" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
      </a>
      <a href="https://substack.com" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="Substack">
        <svg style="width:24px; height:22px; fill:#000;" viewBox="0 0 24 24"><path d="M22.534 7.032H1.466V4.28h21.068v2.752zm0 4.606H1.466v-2.754h21.068v2.754zm0 4.604H1.466V13.49h21.068v2.752zM12 19.72l-10.534-4.8v4.8L12 24.52l10.534-4.8v-4.8L12 19.72z"/></svg>
      </a>
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="GitHub">
        <svg style="width:24px; height:22px; fill:#000;" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 3.513 1.305 4.372.997.107-.775.18-1.305.475-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.7"/></svg>
      </a>
    </div>

  </div>

  <!-- SLIDESHOW OPERATING SCRIPT ENGINE -->
  <script>
    let currentIndex = 0;
    let autoplayTimer = null;
    const slides = document.querySelectorAll('.portfolio-slide');
    const dots = document.querySelectorAll('.step-dot');
    const currentNumDisplay = document.getElementById('current-slide-num');
    const playBtn = document.querySelector('.play-pause-btn');

    function updateSlideRegistry(targetIndex) {
      if (targetIndex >= slides.length) { currentIndex = 0; }
      else if (targetIndex < 0) { currentIndex = slides.length - 1; }
      else { currentIndex = targetIndex; }

      slides.forEach(slide => slide.classList.remove('active-slide'));
      dots.forEach(dot => dot.classList.remove('active-dot'));

      if(slides[currentIndex]) slides[currentIndex].classList.add('active-slide');
      if(dots[currentIndex]) dots[currentIndex].classList.add('active-dot');
      if(currentNumDisplay) currentNumDisplay.textContent = currentIndex + 1;
    }

    function changeSlide(direction) {
      stopAutoplay();
      updateSlideRegistry(currentIndex + direction);
    }

    function goToSlide(index) {
      stopAutoplay();
      updateSlideRegistry(index);
    }

    function togglePlay() {
      if (autoplayTimer) {
        stopAutoplay();
      } else {
        playBtn.innerHTML = "&#9646;&#9646;"; 
        autoplayTimer = setInterval(() => {
          updateSlideRegistry(currentIndex + 1);
        }, 4000); 
      }
    }

    function stopAutoplay() {
      if (autoplayTimer) {
        clearInterval(autoplayTimer);
        autoplayTimer = null;
        playBtn.innerHTML = "&#9658;"; 
      }
    }
  </script>
</body>
</html>
