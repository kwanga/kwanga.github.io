<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  
  <style>
    /* 🎨 CLEAN CANVAS BACKGROUND SYSTEM */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: #ffffff !important;
      color: #111111 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    .project-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px 80px 20px;
      box-sizing: border-box;
    }

    /* PREMIUM TOP NAVIGATION HEADER TABS */
    .menu-tab {
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 4px;
      font-family: sans-serif;
      display: inline-block;
      background-color: transparent;
      color: #000000;
      border: 1px solid rgba(0,0,0,0.15);
    }
    .menu-tab.active {
      background-color: #000000;
      color: #ffffff;
      border: 1px solid #000000;
    }

    /* 📐 CENTERING THE SLIDER REGION FRAME */
    .slider-frame {
      width: 100%;
      max-width: 760px;
      height: 420px;
      margin: 30px auto 40px auto;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.1);
      background: #ffffff;
    }
    .slide-wrapper {
      display: flex;
      width: 300%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
    }
    .slide-card {
      width: 33.333%;
      height: 100%;
    }
    .slide-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #ffffff;
      display: block;
    }

    /* NAVIGATION BUTTON SWITCHING DECK RULES */
    input[name="slide-control"] { display: none; }
    #slide1:checked ~ .slide-wrapper { transform: translateX(0); }
    #slide2:checked ~ .slide-wrapper { transform: translateX(-33.333%); }
    #slide3:checked ~ .slide-wrapper { transform: translateX(-66.666%); }

    /* FIXED BOUNDED FLUSH NAVIGATION CHEVRONS */
    .arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 48px;
      width: 40px;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      user-select: none;
      border-radius: 4px;
    }
    .arrow-btn:hover { background: rgba(0, 0, 0, 0.8); }
    .prev-arrow { left: 10px; }
    .next-arrow { right: 10px; }
    .arrow-btn svg { width: 16px; height: 18px; fill: none; stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }

    #slide1:checked ~ .arrow1, #slide2:checked ~ .arrow2, #slide3:checked ~ .arrow3 { display: flex !important; }
    .arrow-init { display: flex; }
    #slide1:checked ~ .arrow-init, #slide2:checked ~ .arrow-init, #slide3:checked ~ .arrow-init { display: none !important; }

    .social-icon-link { display: inline-block; transition: transform 0.2s ease; }
    .social-icon-link:hover { transform: scale(1.2) translateY(-2px); }
  </style>
</head>
<body>

  <div class="project-container">

    <!-- 🧭 TOP MENU LINKS NAVIGATION -->
    <nav style="display: flex; justify-content: flex-end; gap: 10px; width: 100%; margin-bottom: 20px;">
      <a href="{{ '/' | relative_url }}" class="menu-tab">Home</a>
      <a href="{{ '/about.html' | relative_url }}" class="menu-tab">About</a>
      <a href="{{ '/projects.html' | relative_url }}" class="menu-tab active">Projects</a>
    </nav>

    <h1 style="font-size: 2.5rem; font-weight: 800; margin: 20px 0 5px 0; font-family: serif; line-height: 1.2;">{{ page.title }}</h1>
    <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 30px;">
    <!-- 🎬 SLIDESHOW FRAMEWORK INSIDE NATIVE THEME CONTAINER -->
    <div class="slider-frame">
      <input type="radio" name="slide-control" id="slide1" checked>
      <input type="radio" name="slide-control" id="slide2">
      <input type="radio" name="slide-control" id="slide3">

      <div class="slide-wrapper">
        <!-- 🎞️ SLIDE 1 -->
        <div class="slide-card">
          <img src="{{ '/assets/images/retail-slide1.png' | relative_url }}" alt="Executive Insights Matrix Slide">
        </div>
        <!-- 🎞️ SLIDE 2 -->
        <div class="slide-card">
          <img src="{{ '/assets/images/retail-slide2.png' | relative_url }}" alt="Power BI Performance Metrics Dashboard">
        </div>
        <!-- 🎞️ SLIDE 3 -->
        <div class="slide-card">
          <img src="{{ '/assets/images/retail-slide3.png' | relative_url }}" alt="SQL Pipeline Transformations Grid">
        </div>
      </div>

      <!-- Chevron Arrow Mappings Inside Slider Window -->
      <div class="arrow-init">
        <label for="slide3" class="arrow-btn prev-arrow"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></label>
        <label for="slide2" class="arrow-btn next-arrow"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></label>
      </div>
      <div class="arrow1">
        <label for="slide3" class="arrow-btn prev-arrow"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></label>
        <label for="slide2" class="arrow-btn next-arrow"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></label>
      </div>
      <div class="arrow2">
        <label for="slide1" class="arrow-btn prev-arrow"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></label>
        <label for="slide3" class="arrow-btn next-arrow"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></label>
      </div>
      <div class="arrow3">
        <label for="slide2" class="arrow-btn prev-arrow"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></label>
        <label for="slide1" class="arrow-btn next-arrow"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></label>
      </div>
    </div>

    <!-- 🎯 RECTIFIED MARKDOWN CORE RE-LOADER LAYER -->
    <article class="post-content" style="margin-top: 50px; line-height: 1.8; font-size: 1.05rem;">
      {{ content }}
    </article>

    <!-- 🔗 SOCIAL CONNECT BADGES FOR CASE STUDY BASE DOCK -->
    <div style="margin-top: 60px; padding-top: 30px; border-top: 1px solid #eee; text-align: center; display: flex; justify-content: center; gap: 30px;">
      <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="LinkedIn">
        <svg style="width:24px; height:22px; fill:#000;" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
      </a>
      <a href="https://substack.com" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="Substack">
        <svg style="width:24px; height:22px; fill:#000;" viewBox="0 0 24 24"><path d="M22.534 7.032H1.466V4.28h21.068v2.752zm0 4.606H1.466v-2.754h21.068v2.754zm0 4.604H1.466V13.49h21.068v2.752zM12 19.72l-10.534-4.8v4.8L12 24.52l10.534-4.8v-4.8L12 19.72z"/></svg>
      </a>
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-icon-link" title="GitHub">
        <svg style="width:24px; height:22px; fill:#000;" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 3.513 1.305 4.372.997.107-.775.18-1.305.475-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      </a>
    </div>

  </div> <!-- Closes Master project-container -->
